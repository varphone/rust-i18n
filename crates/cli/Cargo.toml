[package]
description = "cargo-i18n tool for the rust-i18n crate."
edition = "2021"
license = "MIT"
name = "rust-i18n-cli"
readme = "../../README.md"
repository = "https://github.com/longbridgeapp/rust-i18n"
version = "3.1.1"

[dependencies]
anstyle = "1.0.10"
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive"] }
csv = "1.3.1"
globwalk = "0.9.1"
indexmap = "2.8.0"
normpath = "1.3.0"
rust-i18n-support = { path = "../support", version = "3.1.1" }
rust-i18n-extract = { path = "../extract", version = "3.1.1" }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
serde_yml = "0.0.12"
toml = "0.8.20"

[[bin]]
name = "cargo-i18n"
path = "src/main.rs"
